# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

env:
  MIX_ENV: test
  ELIXIR_VERSION: "1.20.2"
  OTP_VERSION: "29.0.2"

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    outputs:
      cache-key: ${{ steps.cache-key.outputs.key }}

    steps:
      - &checkout
        uses: actions/checkout@v7

      - &setup-beam
        name: Set up Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      # One cache entry per commit, so later jobs get exactly this build.
      - name: Compute cache key
        id: cache-key
        run: echo "key=build-${{ runner.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock') }}-${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Restore previous build
        id: restore
        uses: actions/cache/restore@v6
        with:
          path: |
            deps
            _build
          key: ${{ steps.cache-key.outputs.key }}
          restore-keys: |
            build-${{ runner.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock') }}-
            build-${{ runner.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Check for unused dependencies
        run: mix deps.unlock --check-unused

      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Save build
        if: steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            deps
            _build
          key: ${{ steps.cache-key.outputs.key }}

  test:
    name: Tests
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - *checkout
      - *setup-beam
      - &restore-build
        name: Restore build
        uses: actions/cache/restore@v6
        with:
          path: |
            deps
            _build
          key: ${{ needs.build.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Run tests
        run: mix test

  dialyzer:
    name: Dialyzer
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - *checkout
      - *setup-beam
      - *restore-build

      - name: Restore PLTs
        id: plt
        uses: actions/cache/restore@v6
        with:
          path: priv/plts
          key: plt-${{ runner.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            plt-${{ runner.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

      # Saved before the analysis, so a failing run still keeps the PLTs.
      - name: Build PLTs
        if: steps.plt.outputs.cache-hit != 'true'
        run: mix dialyzer --plt

      - name: Save PLTs
        if: steps.plt.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: priv/plts
          key: ${{ steps.plt.outputs.cache-primary-key }}

      - name: Run Dialyzer
        run: mix dialyzer --format github

  credo:
    name: Credo
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - *checkout
      - *setup-beam
      - *restore-build

      - name: Run Credo
        run: mix credo --strict

  format:
    name: Format check
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - *checkout
      - *setup-beam
      - *restore-build

      - name: Check formatting
        run: mix format --check-formatted
